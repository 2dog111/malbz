server {
    listen 80;
    listen [::]:80;
    server_name mal.bz www.mal.bz;

    root /var/www/mal.bz/current;
    index index.html;

    access_log /var/log/nginx/mal.bz.access.log;
    error_log /var/log/nginx/mal.bz.error.log;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
