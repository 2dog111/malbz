server {
    listen 80;
    listen [::]:80;
    server_name mal.bz www.mal.bz;

    root /var/www/mal.bz/current;
    index index.html;

    access_log /var/log/nginx/mal.bz.access.log;
    error_log /var/log/nginx/mal.bz.error.log;

    location = /lusiesta-studio {
        return 301 /offers/lusiesta-studio/;
    }

    location = /lusiesta-studio/ {
        return 301 /offers/lusiesta-studio/;
    }

    location = /telegram-target-parser-5 {
        return 301 /offers/telegram-target-parser-5/;
    }

    location = /telegram-target-parser-5/ {
        return 301 /offers/telegram-target-parser-5/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(data|docs|deploy|scripts)/ {
        deny all;
    }

    location = /AGENTS.md {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
